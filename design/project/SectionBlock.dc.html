<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Inter:wght@400;600;700;800&display=swap"/>
</helmet>
<section style="max-width:1200px;margin:0 auto;padding:32px 24px">
  <div style="{{ headingRowStyle }}">
    <h2 style="{{ headingStyle }}">{{ title }}</h2>
    <a href="{{ seeAllHref }}" style="color:#B01F2E;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap" style-hover="color:#8E1624">{{ seeAllLabel }} {{ seeAllArrow }}</a>
  </div>
  <div style="{{ gridStyle }}">
    <sc-for list="{{ visibleCards }}" as="c" hint-placeholder-count="4">
      <dc-import name="ArticleCard" lang="{{ lang }}" variant="{{ cardVariant }}" href="{{ c.href }}" title="{{ c.title }}" section="{{ c.section }}" time="{{ c.time }}" badge="{{ c.badge }}" image-id="{{ c.imageId }}" is-video="{{ c.isVideo }}" video-duration="{{ c.videoDuration }}" comments="{{ c.comments }}" hint-size="100%,260px"></dc-import>
    </sc-for>
  </div>
  <sc-if value="{{ showButton }}" hint-placeholder-val="{{ false }}">
    <div style="text-align:center;margin-top:24px">
      <button onClick="{{ expand }}" style="{{ showMoreStyle }}" style-hover="background:#F4F5F7;border-color:#C9CED4">{{ showMoreLabel }}</button>
    </div>
  </sc-if>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:420},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ar&quot;,&quot;options&quot;:[&quot;ar&quot;,&quot;en&quot;],&quot;tsType&quot;:&quot;'ar'|'en'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;مصر&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;seeAllHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cardVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;,&quot;text&quot;,&quot;hero&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;cards&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;object&gt;&quot;},&quot;initialCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { expanded: false };
  renderVals() {
    const lang = this.props.lang === 'en' ? 'en' : 'ar';
    const isAr = lang === 'ar';
    const fontDisplay = isAr ? "'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif" : "'Inter',system-ui,sans-serif";
    const cards = this.props.cards || [];
    const initialCount = this.props.initialCount || cards.length;
    const canExpand = cards.length > initialCount;
    const visibleCards = (this.state.expanded || !canExpand) ? cards : cards.slice(0, initialCount);
    return {
      lang,
      title: this.props.title || '', seeAllHref: this.props.seeAllHref || '#',
      seeAllLabel: isAr ? 'عرض الكل' : 'See all', seeAllArrow: isAr ? '←' : '→',
      cardVariant: this.props.cardVariant || 'standard',
      headingRowStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', borderInlineStart: '3px solid #B01F2E', paddingInlineStart: '14px', marginBottom: '20px', flexWrap: 'wrap' },
      headingStyle: { fontFamily: fontDisplay, fontWeight: 800, fontSize: 'clamp(1.1875rem, 1rem + 0.8vw, 1.375rem)', color: '#171A1F', margin: 0 },
      gridStyle: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '20px' },
      visibleCards, showButton: canExpand && !this.state.expanded,
      showMoreLabel: isAr ? 'عرض المزيد' : 'Show more',
      showMoreStyle: { background: '#FFFFFF', border: '1px solid #E2E5E9', borderRadius: '999px', padding: '10px 28px', fontSize: '14px', fontWeight: 600, color: '#171A1F', cursor: 'pointer' },
      expand: () => this.setState({ expanded: true }),
    };
  }
}

</script>
</body>
</html>
