<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ style }}">{{ label }}</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:30},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;published&quot;,&quot;options&quot;:[&quot;published&quot;,&quot;draft&quot;,&quot;review&quot;,&quot;scheduled&quot;,&quot;rejected&quot;,&quot;active&quot;,&quot;paused&quot;,&quot;admin&quot;,&quot;editor&quot;,&quot;author&quot;,&quot;moderator&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const map = {
      published: { label: 'منشور', bg: '#E7F4ED', color: '#0E8A4C' },
      draft: { label: 'مسودة', bg: '#EBEDF0', color: '#3C434C' },
      review: { label: 'قيد المراجعة', bg: '#FBEEEF', color: '#B01F2E' },
      scheduled: { label: 'مجدول', bg: '#FBF3E2', color: '#A97E14' },
      rejected: { label: 'مرفوض', bg: '#FBEDED', color: '#C93030' },
      active: { label: 'مفعّل', bg: '#E7F4ED', color: '#0E8A4C' },
      paused: { label: 'متوقف', bg: '#EBEDF0', color: '#3C434C' },
      admin: { label: 'مدير', bg: '#FBEEEF', color: '#B01F2E' },
      editor: { label: 'محرر', bg: '#E7F4ED', color: '#0E8A4C' },
      author: { label: 'كاتب', bg: '#EBEDF0', color: '#3C434C' },
      moderator: { label: 'مشرف تعليقات', bg: '#FBF3E2', color: '#A97E14' },
    };
    const s = map[this.props.status] || map.draft;
    return { label: s.label, style: { display: 'inline-flex', alignItems: 'center', fontSize: '12px', fontWeight: 700, padding: '3px 10px', borderRadius: '999px', background: s.bg, color: s.color, whiteSpace: 'nowrap' } };
  }
}

</script>
</body>
</html>
