<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"/>
<style>body { margin:0; }</style>
</helmet>
<div dir="rtl" lang="ar" style="background:#F4F5F7;min-height:100vh;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:#171A1F">
  <dc-import name="SiteHeader" lang="ar" active="login" home-href="Home.dc.html" alt-lang-href="Home-EN.dc.html" hint-size="100%,160px"></dc-import>
  <div style="display:flex;justify-content:center;padding:64px 24px">
    <div style="background:#FFFFFF;border:1px solid #E2E5E9;border-radius:6px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 14px rgba(23,26,31,.10)">
      <div style="border-inline-start:3px solid #B01F2E;padding-inline-start:14px;margin-bottom:8px">
        <h1 style="font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:800;font-size:22px;margin:0;color:#171A1F">تسجيل الدخول</h1>
      </div>
      <p style="color:#6A727C;font-size:14px;margin:0 0 24px">سجّل الدخول لمتابعة أخبارك واهتماماتك المفضلة</p>
      <label style="display:block;font-size:13px;font-weight:600;color:#3C434C;margin-bottom:6px">البريد الإلكتروني</label>
      <input type="email" placeholder="name@example.com" style="width:100%;box-sizing:border-box;padding:11px 14px;border-radius:6px;border:1px solid #E2E5E9;background:#F4F5F7;font-size:14px;color:#171A1F;outline:none;margin-bottom:16px" style-focus="border-color:#B01F2E;background:#FFFFFF"/>
      <label style="display:block;font-size:13px;font-weight:600;color:#3C434C;margin-bottom:6px">كلمة المرور</label>
      <div style="position:relative;margin-bottom:8px">
        <input type="{{ passwordType }}" placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:11px 40px 11px 14px;border-radius:6px;border:1px solid #E2E5E9;background:#F4F5F7;font-size:14px;color:#171A1F;outline:none" style-focus="border-color:#B01F2E;background:#FFFFFF"/>
        <button onClick="{{ toggleShow }}" style="position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6A727C;cursor:pointer;font-size:14px">{{ eyeIcon }}</button>
      </div>
      <div style="text-align:end;margin-bottom:20px">
        <a href="#" style="color:#B01F2E;font-size:13px;text-decoration:none;font-weight:600">نسيت كلمة المرور؟</a>
      </div>
      <button style="width:100%;background:#B01F2E;color:#FFFFFF;border:none;border-radius:999px;padding:12px;font-size:15px;font-weight:700;cursor:pointer" style-hover="background:#8E1624">دخول</button>
      <p style="text-align:center;color:#6A727C;font-size:13px;margin-top:20px">ليس لديك حساب؟ <a href="#" style="color:#B01F2E;font-weight:700;text-decoration:none">إنشاء حساب جديد</a></p>
    </div>
  </div>
  <dc-import name="SiteFooter" lang="ar" home-href="Home.dc.html" hint-size="100%,260px"></dc-import>
  <dc-import name="MarketsTicker" lang="ar" hint-size="100%,52px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { showPassword: false };
  renderVals() {
    return {
      passwordType: this.state.showPassword ? 'text' : 'password',
      eyeIcon: this.state.showPassword ? '🙈' : '👁',
      toggleShow: () => this.setState((s) => ({ showPassword: !s.showPassword })),
    };
  }
}

</script>
</body>
</html>
