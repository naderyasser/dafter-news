<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Inter:wght@400;600;700;800&display=swap"/>
</helmet>
<aside style="background:#FFFFFF;border:1px solid #E2E5E9;border-radius:6px;padding:20px">
  <div style="{{ headingStyle }}">{{ heading }}</div>
  <div style="display:flex;flex-direction:column">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="{{ it.href }}" style="{{ it.itemStyle }}">
        <span style="font-size:26px;font-weight:800;color:#B01F2E;font-variant-numeric:tabular-nums;line-height:1;flex-shrink:0;min-width:28px">{{ it.rank }}</span>
        <span style="color:#171A1F;font-size:14px;font-weight:600;line-height:1.5">{{ it.title }}</span>
      </a>
    </sc-for>
  </div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ar&quot;,&quot;options&quot;:[&quot;ar&quot;,&quot;en&quot;],&quot;tsType&quot;:&quot;'ar'|'en'&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{title:string,href:string}&gt;&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang === 'en' ? 'en' : 'ar';
    const isAr = lang === 'ar';
    const fontDisplay = isAr ? "'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif" : "'Inter',system-ui,sans-serif";
    const eastern = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    const toRank = (n) => isAr ? String(n).split('').map(d => eastern[+d]).join('') : String(n);
    const defaultItems = isAr ? [
      { title: 'الحكومة تعلن حزمة دعم جديدة للصناعات الصغيرة', href: '#' },
      { title: 'ارتفاع تاريخي لمؤشر البورصة المصرية في ختام التعاملات', href: '#' },
      { title: 'اتفاق ثنائي لتعزيز التبادل التجاري مع دول الخليج', href: '#' },
      { title: 'نجم المنتخب يوجه رسالة قبل نهائي البطولة', href: '#' },
      { title: 'خبراء: موجة الطقس الحالية تتراجع نهاية الأسبوع', href: '#' },
    ] : [
      { title: 'Government announces new support package for small industry', href: '#' },
      { title: 'Egyptian exchange index closes at historic high', href: '#' },
      { title: 'Bilateral deal to boost trade with Gulf states', href: '#' },
      { title: 'National team star sends message before championship final', href: '#' },
      { title: 'Experts: current heatwave to ease by weekend', href: '#' },
    ];
    const raw = this.props.items || defaultItems;
    const items = raw.map((it, i) => ({ ...it, rank: toRank(i + 1), itemStyle: { display: 'flex', gap: '14px', alignItems: 'flex-start', paddingBlock: '14px', textDecoration: 'none', borderBlockEnd: i === raw.length - 1 ? 'none' : '1px solid #E2E5E9' } }));
    return {
      headingStyle: { borderInlineStart: '3px solid #B01F2E', paddingInlineStart: '12px', fontFamily: fontDisplay, fontWeight: 800, fontSize: '17px', color: '#171A1F', marginBottom: '4px' },
      heading: isAr ? 'الأكثر قراءة' : 'Most read',
      items,
    };
  }
}

</script>
</body>
</html>
