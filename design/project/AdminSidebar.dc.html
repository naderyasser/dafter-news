<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"/>
</helmet>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <span onClick="{{ toggleMobile }}" style="{{ hamburgerStyle }}">☰</span>
</sc-if>
<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeMobile }}" style="position:fixed;inset:0;background:rgba(10,11,13,.5);z-index:94"></div>
</sc-if>
<aside style="{{ asideStyle }}">
  <a href="DashOverview.dc.html" style="text-decoration:none;padding:20px 16px;border-bottom:1px solid #2A2F37;display:block">
    <div style="border-inline-start:3px solid #B01F2E;padding-inline-start:12px;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:800;font-size:17px;color:#F5F6F7">الدفتر نيوز</div>
    <div style="color:#6A727C;font-size:11px;margin-top:4px;padding-inline-start:15px">لوحة التحكم</div>
  </a>
  <nav style="flex:1;overflow-y:auto;padding:12px 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="16">
      <sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
        <div style="padding:14px 10px 6px;color:#565D66;font-size:11px;font-weight:700">{{ r.label }}</div>
      </sc-if>
      <sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ false }}">
        <a href="{{ r.href }}" style="{{ r.style }}">
          <span style="width:18px;text-align:center;flex-shrink:0;font-size:14px">{{ r.icon }}</span>
          <span>{{ r.label }}</span>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <div style="display:flex;align-items:center;gap:10px;padding:16px;border-top:1px solid #2A2F37">
    <div style="width:34px;height:34px;border-radius:50%;background:#3C434C;display:flex;align-items:center;justify-content:center;color:#F5F6F7;font-weight:700;flex-shrink:0">م</div>
    <div style="min-width:0">
      <div style="color:#F5F6F7;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">محرر النظام</div>
      <div style="color:#6A727C;font-size:11px">محرر</div>
    </div>
  </div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:700},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: (typeof window !== 'undefined' && window.innerWidth <= 860), mobileOpen: false };
  componentDidMount() {
    this._onResize = () => this.setState((s) => ({ isMobile: window.innerWidth <= 860, mobileOpen: window.innerWidth <= 860 ? s.mobileOpen : false }));
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  renderVals() {
    const active = this.props.active || '';
    const isMobile = this.state.isMobile, mobileOpen = this.state.mobileOpen;
    const asideStyle = isMobile ? {
      width: '260px', maxWidth: '82vw', flexShrink: 0, background: '#14171C', display: mobileOpen ? 'flex' : 'none', flexDirection: 'column',
      height: '100vh', position: 'fixed', top: 0, insetInlineStart: 0, zIndex: 95, boxShadow: '0 0 24px rgba(0,0,0,.3)',
    } : {
      width: '260px', flexShrink: 0, background: '#14171C', display: 'flex', flexDirection: 'column', minHeight: '100vh', position: 'sticky', top: 0, alignSelf: 'flex-start',
    };
    const groups = [
      { label: 'المحتوى', items: [
        { key: 'overview', label: 'نظرة عامة', href: 'DashOverview.dc.html', icon: '⊞' },
        { key: 'articles', label: 'المقالات', href: 'DashArticles.dc.html', icon: '≡' },
        { key: 'breaking', label: 'الأخبار العاجلة', href: 'DashBreaking.dc.html', icon: '⚡' },
      ]},
      { label: 'الوسائط والبث', items: [
        { key: 'videos', label: 'الفيديوهات', href: 'DashVideos.dc.html', icon: '▶' },
        { key: 'live', label: 'البث المباشر', href: 'DashLive.dc.html', icon: '●' },
        { key: 'opinion', label: 'بالعقل والمنطق', href: 'DashOpinion.dc.html', icon: '"' },
      ]},
      { label: 'التفاعل', items: [
        { key: 'comments', label: 'التعليقات', href: 'DashComments.dc.html', icon: '💬' },
      ]},
      { label: 'الإدارة', items: [
        { key: 'ads', label: 'الإعلانات', href: 'DashAds.dc.html', icon: '▭' },
        { key: 'ticker', label: 'شريط الأسواق', href: 'DashTicker.dc.html', icon: '↗' },
        { key: 'media', label: 'الوسائط', href: 'DashMedia.dc.html', icon: '🖼' },
        { key: 'taxonomy', label: 'الأقسام والوسوم', href: 'DashTaxonomy.dc.html', icon: '#' },
      ]},
      { label: 'النظام', items: [
        { key: 'users', label: 'المستخدمون والأدوار', href: 'DashUsers.dc.html', icon: '👤' },
        { key: 'settings', label: 'الإعدادات', href: 'DashSettings.dc.html', icon: '⚙' },
      ]},
    ];
    const rows = [];
    groups.forEach((g) => {
      rows.push({ isHeader: true, isItem: false, label: g.label });
      g.items.forEach((it) => {
        const isActive = it.key === active;
        rows.push({
          isHeader: false, isItem: true, href: it.href, icon: it.icon, label: it.label,
          style: {
            display: 'flex', alignItems: 'center', gap: '10px', textDecoration: 'none', padding: '9px 10px', borderRadius: '6px', margin: '1px 0',
            color: isActive ? '#F5F6F7' : '#9AA1AA', fontWeight: isActive ? 700 : 500, fontSize: '13.5px',
            borderInlineStart: isActive ? '3px solid #B01F2E' : '3px solid transparent',
            background: isActive ? 'rgba(176,31,46,.15)' : 'transparent',
          },
        });
      });
    });
    return {
      rows, isMobile, mobileOpen, asideStyle,
      toggleMobile: () => this.setState((s) => ({ mobileOpen: !s.mobileOpen })),
      closeMobile: () => this.setState({ mobileOpen: false }),
      hamburgerStyle: { position: 'fixed', top: '14px', insetInlineStart: '14px', zIndex: 96, width: '38px', height: '38px', borderRadius: '8px', background: '#14171C', color: '#F5F6F7', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '16px', cursor: 'pointer', boxShadow: '0 2px 8px rgba(0,0,0,.25)' },
    };
  }
}

</script>
</body>
</html>
