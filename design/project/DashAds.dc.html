<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"/>
<style>body { margin:0; }</style>
</helmet>
<div dir="rtl" lang="ar" style="display:flex;min-height:100vh;background:#F4F5F7;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:#171A1F">
  <dc-import name="AdminSidebar" active="ads" hint-size="260px,100%"></dc-import>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <dc-import name="AdminTopbar" hint-size="100%,64px"></dc-import>
    <div style="padding:24px 28px;display:flex;flex-direction:column;gap:20px">
      <div>
        <div style="color:#6A727C;font-size:12px;margin-bottom:4px">لوحة التحكم / الإدارة</div>
        <div style="border-inline-start:3px solid #B01F2E;padding-inline-start:14px">
          <h1 style="font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:800;font-size:22px;margin:0;color:#171A1F">الإعلانات</h1>
        </div>
      </div>
      <div style="background:#FFFFFF;border:1px solid #E2E5E9;border-radius:6px;overflow:hidden">
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr;background:#F4F5F7">
          <div style="{{ thStyle }}">الموضع</div><div style="{{ thStyle }}">المقاس</div><div style="{{ thStyle }}">الحالة</div><div style="{{ thStyle }}">ظهور</div><div style="{{ thStyle }}">نقرات</div><div style="{{ thStyle }}">CTR</div>
        </div>
        <sc-for list="{{ placements }}" as="p" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr;align-items:center;min-height:48px;border-top:1px solid #E2E5E9">
            <div style="{{ tdStyle }}">{{ p.name }}</div>
            <div style="{{ tdStyleMuted }}">{{ p.size }}</div>
            <div><span onClick="{{ p.toggle }}" style="{{ p.switchTrackStyle }}"><span style="{{ p.switchDotStyle }}"></span></span></div>
            <div style="{{ tdStyleTnum }}">{{ p.impressions }}</div>
            <div style="{{ tdStyleTnum }}">{{ p.clicks }}</div>
            <div style="{{ tdStyleTnum }}">{{ p.ctr }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = {
    placements: [
      { id: 1, name: 'أعلى الهيدر', size: '728×90', impressions: 128400, clicks: 612, active: true },
      { id: 2, name: 'داخل متن المقال', size: '336×280', impressions: 84210, clicks: 940, active: true },
      { id: 3, name: 'الشريط الجانبي', size: '300×600', impressions: 96500, clicks: 405, active: true },
      { id: 4, name: 'بين بلوكات القسم', size: '728×90', impressions: 41200, clicks: 188, active: false },
    ],
  };
  renderVals() {
    const thStyle = { textAlign: 'start', padding: '10px 14px', fontSize: '12px', fontWeight: 700, color: '#6A727C' };
    const tdStyle = { padding: '0 14px', fontSize: '13.5px', color: '#171A1F', fontWeight: 600 };
    const tdStyleMuted = Object.assign({}, tdStyle, { color: '#6A727C', fontWeight: 400 });
    const tdStyleTnum = Object.assign({}, tdStyle, { fontVariantNumeric: 'tabular-nums' });
    const placements = this.state.placements.map((p) => ({
      ...p, tdStyle, tdStyleMuted, tdStyleTnum,
      impressions: p.impressions.toLocaleString('en-US'), clicks: p.clicks.toLocaleString('en-US'),
      ctr: ((p.clicks / p.impressions) * 100).toFixed(2) + '%',
      toggle: () => this.setState((s) => ({ placements: s.placements.map((x) => x.id === p.id ? { ...x, active: !x.active } : x) })),
      switchTrackStyle: { width: '36px', height: '20px', borderRadius: '999px', background: p.active ? '#B01F2E' : '#C9CED4', position: 'relative', cursor: 'pointer', display: 'inline-block' },
      switchDotStyle: { position: 'absolute', top: '2px', insetInlineStart: p.active ? '18px' : '2px', width: '16px', height: '16px', borderRadius: '50%', background: '#FFFFFF', transition: '120ms ease' },
    }));
    return { thStyle, placements };
  }
}

</script>
</body>
</html>
