<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"/>
<style>body { margin:0; }</style>
</helmet>
<div dir="rtl" lang="ar" style="background:#F4F5F7;min-height:100vh;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:#171A1F">
  <dc-import name="SiteHeader" lang="ar" active="home" home-href="Home.dc.html" alt-lang-href="Home-EN.dc.html" hint-size="100%,160px"></dc-import>

  <div style="max-width:1200px;margin:0 auto;padding:24px;display:flex;gap:20px;flex-wrap:wrap">
    <div style="flex:2 1 480px;min-width:0">
      <dc-import name="ArticleCard" lang="ar" variant="hero" href="Article.dc.html" title="{{ heroMain.title }}" section="{{ heroMain.section }}" time="{{ heroMain.time }}" badge="{{ heroMain.badge }}" image-id="home-hero-main" hint-size="100%,420px"></dc-import>
    </div>
    <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:0">
      <sc-for list="{{ heroSide }}" as="h" hint-placeholder-count="3">
        <div style="border-block-end:1px solid #E2E5E9;padding-block-end:14px;margin-block-end:14px">
          <dc-import name="ArticleCard" lang="ar" variant="compact" href="{{ h.href }}" title="{{ h.title }}" section="{{ h.section }}" time="{{ h.time }}" badge="{{ h.badge }}" image-id="{{ h.imageId }}" hint-size="100%,90px"></dc-import>
        </div>
      </sc-for>
    </div>
  </div>

  <dc-import name="SectionBlock" lang="ar" title="مصر" see-all-href="Section.dc.html?section=egypt" card-variant="standard" cards="{{ egyptCards }}" initial-count="4" hint-size="100%,420px"></dc-import>
  <dc-import name="SectionBlock" lang="ar" title="اقتصاد" see-all-href="Section.dc.html?section=economy" card-variant="standard" cards="{{ econCards }}" initial-count="4" hint-size="100%,420px"></dc-import>
  <dc-import name="SectionBlock" lang="ar" title="لقطة وتعليق" see-all-href="VideoList.dc.html" card-variant="standard" cards="{{ videoCards }}" initial-count="4" hint-size="100%,420px"></dc-import>
  <dc-import name="SectionBlock" lang="ar" title="رياضة" see-all-href="Section.dc.html?section=sports" card-variant="standard" cards="{{ sportsCards }}" initial-count="4" hint-size="100%,420px"></dc-import>

  <dc-import name="OpinionCarousel" lang="ar" hint-size="100%,340px"></dc-import>

  <div style="max-width:1200px;margin:0 auto;padding:32px 24px;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start">
    <div style="flex:2 1 480px;min-width:0">
      <div style="{{ newsHeadingRowStyle }}">
        <h2 style="{{ sectionHeadingStyle }}">أحدث الأخبار</h2>
        <div style="display:flex;gap:8px">
          <button onClick="{{ showLatest }}" style="{{ tabLatestStyle }}">الأحدث</button>
          <button onClick="{{ showPopular }}" style="{{ tabPopularStyle }}">الأكثر تعليقاً</button>
        </div>
      </div>
      <div>
        <sc-for list="{{ newsList }}" as="n" hint-placeholder-count="6">
          <dc-import name="ArticleCard" lang="ar" variant="text" href="{{ n.href }}" title="{{ n.title }}" time="{{ n.time }}" hint-size="100%,80px"></dc-import>
        </sc-for>
      </div>
    </div>
    <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px">
      <dc-import name="MostReadList" lang="ar" hint-size="100%,360px"></dc-import>
      <div style="background:#FFFFFF;border:1px solid #E2E5E9;border-radius:6px;padding:20px">
        <div style="{{ tagsHeadingStyle }}">وسوم رائجة</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">
          <sc-for list="{{ tags }}" as="tg" hint-placeholder-count="5">
            <a href="{{ tg.href }}" style="background:#FBEEEF;color:#B01F2E;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;text-decoration:none" style-hover="background:#B01F2E;color:#FFFFFF">{{ tg.label }}</a>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <dc-import name="SiteFooter" lang="ar" home-href="Home.dc.html" hint-size="100%,260px"></dc-import>
  <dc-import name="MarketsTicker" lang="ar" hint-size="100%,52px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { newsTab: 'latest' };
  renderVals() {
    const heroMain = { title: 'الرئيس يفتتح المرحلة الثانية من محور الدلتا الجديد بتكلفة 12 مليار جنيه', section: 'مصر', time: 'منذ 30 دقيقة', badge: 'breaking' };
    const heroSide = [
      { title: 'البنك المركزي يثبّت أسعار الفائدة للاجتماع الثالث على التوالي', section: 'اقتصاد', time: 'منذ ساعة', badge: 'none', href: 'Article.dc.html', imageId: 'home-hero-side-1' },
      { title: 'الأهلي يحسم صفقة نجم الوسط قبل ساعات من إغلاق القيد', section: 'رياضة', time: 'منذ ساعتين', badge: 'exclusive', href: 'Article.dc.html', imageId: 'home-hero-side-2' },
      { title: 'ارتفاع درجات الحرارة إلى 38 درجة في القاهرة الكبرى اليوم', section: 'مصر', time: 'منذ 3 ساعات', badge: 'none', href: 'Article.dc.html', imageId: 'home-hero-side-3' },
    ];
    const mk = (title, section, time, badge, imageId, i) => ({ href: 'Article.dc.html', title, section, time, badge: badge || 'none', imageId: imageId + '-' + i, isVideo: false, videoDuration: '', comments: 0 });
    const egyptCards = [
      mk('مجلس الوزراء يوافق على حزمة حوافز جديدة للمصانع الصغيرة', 'مصر', 'منذ ساعة', 'none', 'home-egypt', 1),
      mk('افتتاح أول محطة لتحلية مياه البحر على الساحل الشمالي', 'مصر', 'منذ ساعتين', 'exclusive', 'home-egypt', 2),
      mk('محافظ القاهرة يتابع أعمال تطوير ميدان رمسيس', 'مصر', 'منذ 3 ساعات', 'none', 'home-egypt', 3),
      mk('توسعات جديدة في شبكة المترو تشمل خط حلوان', 'مصر', 'منذ 4 ساعات', 'none', 'home-egypt', 4),
      mk('وزارة الصحة تطلق مبادرة الكشف المبكر عن الأمراض المزمنة', 'مصر', 'أمس', 'none', 'home-egypt', 5),
      mk('الأرصاد تحذر من رياح نشطة على السواحل الشمالية غداً', 'مصر', 'أمس', 'none', 'home-egypt', 6),
    ];
    const econCards = [
      mk('الجنيه يسجل استقراراً أمام الدولار للأسبوع الثالث', 'اقتصاد', 'منذ ساعة', 'none', 'home-econ', 1),
      mk('بورصة مصر تغلق على ارتفاع بقيادة أسهم البنوك', 'اقتصاد', 'منذ ساعتين', 'exclusive', 'home-econ', 2),
      mk('صندوق النقد يشيد ببرنامج الإصلاح الاقتصادي المصري', 'اقتصاد', 'منذ 4 ساعات', 'none', 'home-econ', 3),
      mk('ارتفاع صادرات الغزل والنسيج 18% خلال النصف الأول', 'اقتصاد', 'أمس', 'none', 'home-econ', 4),
    ];
    const videoCards = [1, 2, 3, 4].map((i) => ({
      href: 'Article.dc.html', section: 'لقطة وتعليق', isVideo: true,
      imageId: 'home-video-' + i, badge: i === 2 ? 'exclusive' : 'none',
      title: ['لحظة إنقاذ طفل من الغرق على شاطئ الإسكندرية', 'تعليق الكابتن على أداء المنتخب في المباراة الأخيرة', 'جولة داخل أكبر مصنع سيارات كهربائية في مصر', 'ردود الفعل الأولى بعد قرار البنك المركزي'][i - 1],
      time: ['منذ ساعة', 'منذ ساعتين', 'منذ 3 ساعات', 'أمس'][i - 1],
      videoDuration: ['03:12', '05:44', '07:20', '02:58'][i - 1],
      comments: [42, 118, 27, 63][i - 1],
    }));
    const sportsCards = [
      mk('الأهلي يتأهل لنهائي دوري أبطال أفريقيا بعد فوز كاسح', 'رياضة', 'منذ ساعتين', 'none', 'home-sports', 1),
      mk('الزمالك يتعاقد مع مدرب جديد قبل بداية الموسم', 'رياضة', 'منذ 3 ساعات', 'none', 'home-sports', 2),
      mk('المنتخب الوطني يستعد لمواجهة حاسمة في تصفيات المونديال', 'رياضة', 'منذ 4 ساعات', 'exclusive', 'home-sports', 3),
      mk('نجم الكرة المصرية يفوز بجائزة أفضل لاعب في القارة', 'رياضة', 'أمس', 'none', 'home-sports', 4),
    ];
    const newsLatest = [
      { title: 'التعليم العالي يعلن مواعيد تنسيق المرحلة الثانية', time: 'منذ 20 دقيقة' },
      { title: 'ارتفاع أسعار الذهب عالمياً مع تصاعد التوترات', time: 'منذ 40 دقيقة' },
      { title: 'توقيع بروتوكول تعاون بين القاهرة ونيروبي', time: 'منذ ساعة' },
      { title: 'إطلاق منصة رقمية موحدة لخدمات الشهر العقاري', time: 'منذ ساعتين' },
      { title: 'استمرار غلق مدارس بورسعيد بسبب سوء الطقس', time: 'منذ 3 ساعات' },
      { title: 'تراجع أسعار الطماطم والخضروات في الأسواق', time: 'منذ 4 ساعات' },
    ].map((n, i) => ({ ...n, href: 'Article.dc.html' }));
    const newsPopular = [
      { title: 'تحقيق: كواليس اجتماع البنك المركزي الأخير', time: '124 تعليق' },
      { title: 'ظاهرة الغبار.. الأسباب وطرق الوقاية', time: '98 تعليق' },
      { title: 'قرار جديد بشأن رسوم استيراد السيارات', time: '87 تعليق' },
      { title: 'حوار خاص مع مدير المنتخب الوطني', time: '76 تعليق' },
      { title: 'ملف: مستقبل التعليم الفني في مصر', time: '54 تعليق' },
      { title: 'الحكومة ترد على شائعات رفع أسعار الوقود', time: '49 تعليق' },
    ].map((n) => ({ ...n, href: 'Article.dc.html' }));

    const tabBase = { border: '1px solid #E2E5E9', borderRadius: '999px', padding: '8px 16px', fontSize: '13px', fontWeight: 600, cursor: 'pointer' };
    return {
      heroMain, heroSide, egyptCards, econCards, videoCards, sportsCards,
      newsList: this.state.newsTab === 'latest' ? newsLatest : newsPopular,
      tags: ['اقتصاد', 'كرة القدم', 'المناخ', 'التعليم', 'الذهب'].map((t) => ({ label: t, href: 'Tag.dc.html?tag=' + encodeURIComponent(t) })),
      newsHeadingRowStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', borderInlineStart: '3px solid #B01F2E', paddingInlineStart: '14px', marginBottom: '12px', flexWrap: 'wrap' },
      sectionHeadingStyle: { fontFamily: "'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif", fontWeight: 800, fontSize: 'clamp(1.1875rem, 1rem + 0.8vw, 1.375rem)', color: '#171A1F', margin: 0 },
      tagsHeadingStyle: { borderInlineStart: '3px solid #B01F2E', paddingInlineStart: '12px', fontFamily: "'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif", fontWeight: 800, fontSize: '15px', color: '#171A1F' },
      tabLatestStyle: Object.assign({}, tabBase, this.state.newsTab === 'latest' ? { background: '#B01F2E', color: '#FFFFFF', borderColor: '#B01F2E' } : { background: '#FFFFFF', color: '#171A1F' }),
      tabPopularStyle: Object.assign({}, tabBase, this.state.newsTab === 'popular' ? { background: '#B01F2E', color: '#FFFFFF', borderColor: '#B01F2E' } : { background: '#FFFFFF', color: '#171A1F' }),
      showLatest: () => this.setState({ newsTab: 'latest' }),
      showPopular: () => this.setState({ newsTab: 'popular' }),
    };
  }
}

</script>
</body>
</html>
