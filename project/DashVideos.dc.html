<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"/>
<script src="./image-slot.js"></script>
<style>body { margin:0; }</style>
</helmet>
<div dir="rtl" lang="ar" style="display:flex;min-height:100vh;background:#F4F5F7;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:#171A1F">
  <dc-import name="AdminSidebar" active="videos" hint-size="260px,100%"></dc-import>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <dc-import name="AdminTopbar" hint-size="100%,64px"></dc-import>
    <div style="padding:24px 28px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <div style="color:#6A727C;font-size:12px;margin-bottom:4px">لوحة التحكم / الوسائط والبث</div>
          <div style="border-inline-start:3px solid #B01F2E;padding-inline-start:14px">
            <h1 style="font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:800;font-size:22px;margin:0;color:#171A1F">الفيديوهات</h1>
          </div>
        </div>
        <button style="background:#B01F2E;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer" style-hover="background:#8E1624">⬆ رفع فيديو جديد</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:16px">
        <sc-for list="{{ videos }}" as="v" hint-placeholder-count="6">
          <div style="background:#FFFFFF;border:1px solid #E2E5E9;border-radius:6px;overflow:hidden">
            <div style="position:relative;aspect-ratio:16/9;background:#EBEDF0">
              <image-slot id="{{ v.imageId }}" shape="rect" placeholder="صورة الفيديو"></image-slot>
              <span style="position:absolute;inset-inline-start:8px;inset-block-end:8px;background:rgba(23,26,31,.75);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums">{{ v.duration }}</span>
            </div>
            <div style="padding:12px 14px">
              <div style="font-weight:700;font-size:13.5px;line-height:1.5;margin-bottom:8px">{{ v.title }}</div>
              <div style="display:flex;gap:6px;margin-bottom:10px">
                <button onClick="{{ v.toggleLive }}" style="{{ v.liveChipStyle }}">مباشر</button>
                <button onClick="{{ v.toggleExclusive }}" style="{{ v.exclusiveChipStyle }}">خاص</button>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;color:#6A727C;font-size:12px">
                <span>💬 {{ v.comments }} تعليق</span>
                <a href="DashComments.dc.html" style="color:#B01F2E;font-weight:700;text-decoration:none">إدارة التعليقات</a>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = {
    videos: [
      { id: 1, title: 'لحظة إنقاذ طفل من الغرق على شاطئ الإسكندرية', duration: '03:12', comments: 42, live: false, exclusive: false },
      { id: 2, title: 'تعليق الكابتن على أداء المنتخب في المباراة الأخيرة', duration: '05:44', comments: 118, live: false, exclusive: true },
      { id: 3, title: 'جولة داخل أكبر مصنع سيارات كهربائية في مصر', duration: '07:20', comments: 27, live: false, exclusive: false },
      { id: 4, title: 'تغطية حية لمؤتمر البنك المركزي', duration: '—', comments: 8, live: true, exclusive: false },
      { id: 5, title: 'ملخص مباراة الأهلي والترجي في أفريقيا', duration: '04:10', comments: 205, live: false, exclusive: false },
      { id: 6, title: 'جولة ميدانية داخل محور الدلتا الجديد', duration: '06:02', comments: 51, live: false, exclusive: false },
    ],
  };
  toggle(id, key) { this.setState((s) => ({ videos: s.videos.map((v) => v.id === id ? { ...v, [key]: !v[key] } : v) })); }
  renderVals() {
    const chipBase = { border: '1px solid #E2E5E9', borderRadius: '999px', padding: '4px 12px', fontSize: '11.5px', fontWeight: 700, cursor: 'pointer' };
    const videos = this.state.videos.map((v) => ({
      ...v, imageId: 'dashvideo-' + v.id,
      toggleLive: () => this.toggle(v.id, 'live'), toggleExclusive: () => this.toggle(v.id, 'exclusive'),
      liveChipStyle: Object.assign({}, chipBase, v.live ? { background: '#D71F30', color: '#fff', borderColor: '#D71F30' } : { background: '#FFFFFF', color: '#171A1F' }),
      exclusiveChipStyle: Object.assign({}, chipBase, v.exclusive ? { background: '#A97E14', color: '#fff', borderColor: '#A97E14' } : { background: '#FFFFFF', color: '#171A1F' }),
    }));
    return { videos };
  }
}

</script>
</body>
</html>
